[workspace]
resolver = "2"
members = ["src/*", "xtask/"]
default-members = ["src/*"]
exclude = ["ruwuma", "ruma-upstream", "src/direct_tls"]

[workspace.package]
authors = ["Continuwuity Team and contributors <team@continuwuity.org>"]
description = "A Matrix homeserver written in Rust, the official continuation of the conduwuit homeserver."
edition = "2024"
homepage = "https://continuwuity.org/"
license = "Apache-2.0"
# See also `rust-toolchain.toml`
readme = "README.md"
repository = "https://forgejo.ellis.link/continuwuation/continuwuity"
version = "0.5.10"

[workspace.metadata.crane]
name = "conduwuit"

[workspace.dependencies.arrayvec]
version = "0.7.6"
features = ["serde"]

[workspace.dependencies.smallvec]
version = "1.14.0"
features = [
    "const_generics",
    "const_new",
    "serde",
    "union",
    "write",
]

[workspace.dependencies.smallstr]
version = "0.3"
features = ["ffi", "std", "union"]

[workspace.dependencies.const-str]
version = "1.1.0"

[workspace.dependencies.ctor]
version = "0.10.0"

[workspace.dependencies.cargo_toml]
version = "0.22"
default-features = false
features = ["features"]

[workspace.dependencies.toml]
version = "1.1.2"
default-features = false
features = ["parse", "serde"]

[workspace.dependencies.base64]
version = "0.22.1"
default-features = false

# Used for MSC0F01 gossip reconciliation Bloom filter (XXH3 double-hashing)
[workspace.dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3"]

# used for TURN server authentication
[workspace.dependencies.hmac]
version = "0.13.0"
default-features = false

[workspace.dependencies.rand]
version = "0.10.0"

# Used for the http request / response body type for Ruma endpoints used with reqwest
[workspace.dependencies.bytes]
version = "1.10.1"

[workspace.dependencies.http-body-util]
version = "0.1.3"

[workspace.dependencies.http]
version = "1.3.1"

[workspace.dependencies.matchit]
version = "0.8.4"

[workspace.dependencies.regex]
version = "1.11.1"

[workspace.dependencies.axum]
version = "0.8.8"
default-features = false
features = [
    "form",
    "http1",
    "http2",
    "query",
    "tokio",
]

[workspace.dependencies.axum-extra]
version = "0.12.0"
default-features = false
