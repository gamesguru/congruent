[workspace.dependencies.cyborgtime]
version = "2.1.1"

# used for MPSC channels
[workspace.dependencies.loole]
version = "0.4.0"

# used for MPMC channels
[workspace.dependencies.async-channel]
version = "2.5.0"

[workspace.dependencies.async-trait]
version = "0.1.88"

[workspace.dependencies.lru-cache]
version = "0.1.2"

[workspace.dependencies.moka]
version = "0.12"
default-features = false
features = ["sync", "future"]

[workspace.dependencies.dashmap]
version = "6.1.0"

[workspace.dependencies.typed-arena]
version = "2.0.2"

[workspace.dependencies.mtxdb]
git = "https://gitlab.com/Wombat-Foundation/mtxdb.git"
branch = "refactor/pack-id-store-layout"
features = ["reconcile"]

[workspace.dependencies.rezzy]
git = "https://gitlab.com/gamesguru/rezzy.git"
branch = "alpha"

[workspace.dependencies.mtx-slipstream]
package = "mtx-slipstream"
git = "https://gitlab.com/Wombat-Foundation/mtx-slipstream.git"
branch = "dev"

[workspace.dependencies.rust-rocksdb]
git = "https://forgejo.ellis.link/continuwuation/rust-rocksdb-zaidoon1"
rev = "61d9d23872197e9ace4a477f2617d5c9f50ecb23"
default-features = false
# Only zstd is compiled in: the other codecs (lz4, bzip2, zlib) each pull a
# separate C build for a marginal win, and RocksDB records the codec per data
# block, so an existing database is only readable with the codec it was written
# with. See `rocksdb_compression_algo`.
features = [
    "multi-threaded-cf",
    "zstd",
]

[workspace.dependencies.sha2]
version = "0.11.0"
default-features = false

[workspace.dependencies.sha1]
version = "0.11.0"
default-features = false



[workspace.dependencies.mimalloc]
