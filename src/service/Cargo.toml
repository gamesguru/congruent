[package]
description.workspace = true
edition.workspace     = true
homepage.workspace    = true
license.workspace     = true
name                  = "conduwuit_service"
readme.workspace      = true
repository.workspace  = true
version.workspace     = true

[lib]
crate-type = [
	"rlib",
	#	"dylib",
]
path = "mod.rs"

# `ctor` is used only via the `::ctor::ctor` paths emitted by
# `conduwuit_macros::introspect_crate!`, which cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["const-str", "ctor"]

[features]
blurhashing = ["dep:blurhash", "dep:image"]
brotli_compression = ["conduwuit-core/brotli_compression", "reqwest/brotli"]
console = ["dep:rustyline-async", "dep:termimad"]
element_hacks = []
gzip_compression = ["conduwuit-core/gzip_compression", "reqwest/gzip"]
io_uring = ["conduwuit-database/io_uring"]
jemalloc = ["conduwuit-core/jemalloc", "conduwuit-database/jemalloc"]
jemalloc_conf = [
	"conduwuit-core/jemalloc_conf",
	"conduwuit-database/jemalloc_conf",
]
jemalloc_prof = [
	"conduwuit-core/jemalloc_prof",
	"conduwuit-database/jemalloc_prof",
]
jemalloc_stats = [
	"conduwuit-core/jemalloc_stats",
	"conduwuit-database/jemalloc_stats",
]
ldap = ["dep:ldap3"]
media_thumbnail = ["dep:image"]
release_max_log_level = [
	"conduwuit-core/release_max_log_level",
	"conduwuit-database/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
# TLS crypto providers are opt-in so this library stays provider-agnostic for
# its consumers. The `setup_test_services` tests install the selected provider
# (see state/tests.rs); a provider is only expected when this feature is
# enabled, mirroring how the `conduwuit` binary selects one (src/main).
ring = ["rustls/ring"]
systemd = ["dep:sd-notify"]
url_preview = ["dep:image", "dep:webpage"]
zstd_compression = [
	"conduwuit-core/zstd_compression",
	"conduwuit-database/zstd_compression",
	"reqwest/zstd",
]

[dependencies]
typed-arena = { workspace = true }
askama.workspace = true
async-trait.workspace = true
base64.workspace = true
blurhash.optional = true
blurhash.workspace = true
bytes.workspace = true
conduwuit-core.workspace = true
conduwuit-database.workspace = true
conduwuit-macros.workspace = true
const-str.workspace = true
ctor.workspace = true
either.workspace = true
futures.workspace = true
governor.workspace = true
hickory-resolver.workspace = true
http.workspace = true
image.optional = true
image.workspace = true
ipaddress.workspace = true
itertools.workspace = true
ldap3.optional = true
ldap3.workspace = true
lettre.workspace = true
linkify = "0.10.0"
log.workspace = true
loole.workspace = true
lru-cache.workspace = true
moka.workspace = true
nonzero_ext.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rezzy.workspace = true
roaring.workspace = true
rustyline-async.optional = true
rustyline-async.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
slipstream.workspace = true
sha2.workspace = true
hmac.workspace = true
termimad.optional = true
termimad.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
webpage.optional = true
webpage.workspace = true
yansi.workspace = true
dashmap.workspace = true
bincode = "1.3.3"

[target.'cfg(all(unix, target_os = "linux"))'.dependencies]
sd-notify.optional  = true
sd-notify.workspace = true

[dev-dependencies]
serde_json.workspace = true
figment = { workspace = true, features = ["toml"] }
# Tests spawn a reqwest-driven server, which needs a TLS crypto provider
# installed. `ring` is enabled here (test-only) so the state tests have a
# deterministic provider regardless of which providers the library's own
# optional `ring` feature selects. Enabling it on the dev dependency does not
# leak a provider onto the library's consumers.
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
