[package]
description.workspace = true
edition.workspace     = true
homepage.workspace    = true
license.workspace     = true
name                  = "conduwuit_service"
readme.workspace      = true
repository.workspace  = true
version.workspace     = true

[lib]
crate-type = [
	"rlib",
	#	"dylib",
]
path = "mod.rs"

[features]
# Match the `conduwuit` binary default (src/main/Cargo.toml) so the service
# lib installs a TLS crypto provider for its `setup_test_services` tests.
default = ["ring"]
aws_lc_rs = ["rustls/aws_lc_rs"]
blurhashing = ["dep:blurhash", "dep:image"]
brotli_compression = ["conduwuit-core/brotli_compression", "reqwest/brotli"]
console = ["dep:rustyline-async", "dep:termimad"]
element_hacks = []
gzip_compression = ["conduwuit-core/gzip_compression", "reqwest/gzip"]
io_uring = ["conduwuit-database/io_uring"]
jemalloc = ["conduwuit-core/jemalloc", "conduwuit-database/jemalloc"]
jemalloc_conf = [
	"conduwuit-core/jemalloc_conf",
	"conduwuit-database/jemalloc_conf",
]
jemalloc_prof = [
	"conduwuit-core/jemalloc_prof",
	"conduwuit-database/jemalloc_prof",
]
jemalloc_stats = [
	"conduwuit-core/jemalloc_stats",
	"conduwuit-database/jemalloc_stats",
]
ldap = ["dep:ldap3"]
media_thumbnail = ["dep:image"]
release_max_log_level = [
	"conduwuit-core/release_max_log_level",
	"conduwuit-database/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
ring = ["rustls/ring"]
systemd = ["dep:sd-notify"]
url_preview = ["dep:image", "dep:webpage"]
zstd_compression = [
	"conduwuit-core/zstd_compression",
	"conduwuit-database/zstd_compression",
	"reqwest/zstd",
]

[dependencies]
askama.workspace = true
async-trait.workspace = true
base64.workspace = true
blurhash.optional = true
blurhash.workspace = true
bytes.workspace = true
conduwuit-core.workspace = true
conduwuit-database.workspace = true
conduwuit-macros.workspace = true
const-str.workspace = true
ctor.workspace = true
either.workspace = true
futures.workspace = true
governor.workspace = true
hickory-resolver.workspace = true
http.workspace = true
image.optional = true
image.workspace = true
ipaddress.workspace = true
itertools.workspace = true
ldap3.optional = true
ldap3.workspace = true
lettre.workspace = true
linkify = "0.10.0"
log.workspace = true
loole.workspace = true
lru-cache.workspace = true
moka.workspace = true
nonzero_ext.workspace = true
rand.workspace = true
recaptcha-verify = { version = "0.2.0", default-features = false }
regex.workspace = true
reqwest.workspace = true
reqwest_recaptcha = { package = "reqwest", version = "0.12.28", default-features = false, features = [
	"rustls-tls-native-roots-no-provider",
] } # As long as recaptcha-verify's reqwest is outdated
rezzy.workspace = true
ruma.workspace = true
rustyline-async.optional = true
rustyline-async.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
termimad.optional = true
termimad.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
webpage.optional = true
webpage.workspace = true
yansi.workspace = true

[target.'cfg(all(unix, target_os = "linux"))'.dependencies]
sd-notify.optional  = true
sd-notify.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["toml"] }
rustls.workspace = true
criterion.workspace = true

[[bench]]
name = "hamt"
path = "../../benches/hamt.rs"
harness = false

[lints]
workspace = true
