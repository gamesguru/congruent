[package]
name = "conduwuit_database"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

# `ctor` is used only via the `::ctor::ctor` paths emitted by
# `conduwuit_macros::introspect_crate!`.
[package.metadata.cargo-machete]
ignored = ["const-str", "ctor"]

[features]
mimalloc = [
	"conduwuit-core/mimalloc",
]
mimalloc_conf = [
	"conduwuit-core/mimalloc_conf",
]
mimalloc_prof = [
	"conduwuit-core/mimalloc_prof",
]
mimalloc_stats = [
	"conduwuit-core/mimalloc_stats",
]
release_max_log_level = [
	"conduwuit-core/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
]
zstd_compression = [
	"conduwuit-core/zstd_compression",
]

[dependencies]
async-channel.workspace = true
conduwuit-core.workspace = true
conduwuit-macros.workspace = true
const-str.workspace = true
ctor.workspace = true
futures.workspace = true
log.workspace = true
minicbor.workspace = true
minicbor-serde.workspace = true
redb = "4.3.0"
serde.workspace = true
slipstream.workspace = true
tokio.workspace = true

[dev-dependencies]

[lints]
workspace = true
