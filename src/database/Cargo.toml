[package]
name = "conduwuit_database"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

# `ctor` is used only via the `::ctor::ctor` paths emitted by
# `conduwuit_macros::introspect_crate!`.
[package.metadata.cargo-machete]
ignored = ["const-str", "ctor"]

[features]
io_uring = [
	"rust-rocksdb/io-uring",
]
jemalloc = [
	"conduwuit-core/jemalloc",
	"rust-rocksdb/jemalloc",
]
jemalloc_conf = [
	"conduwuit-core/jemalloc_conf",
]
jemalloc_prof = [
	"conduwuit-core/jemalloc_prof",
]
jemalloc_stats = [
	"conduwuit-core/jemalloc_stats",
]
release_max_log_level = [
	"conduwuit-core/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
zstd_compression = [
	"conduwuit-core/zstd_compression",
	"rust-rocksdb/zstd",
]
bindgen-static = [
    "rust-rocksdb/mt_static"
]
bindgen-runtime = [
    "rust-rocksdb/bindgen-runtime"
]

[dependencies]
async-channel.workspace = true
conduwuit-core.workspace = true
conduwuit-macros.workspace = true
const-str.workspace = true
ctor.workspace = true
futures.workspace = true
log.workspace = true
minicbor.workspace = true
minicbor-serde.workspace = true
rust-rocksdb.workspace = true
serde.workspace = true
slipstream.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
figment.workspace = true

[lints]
workspace = true
