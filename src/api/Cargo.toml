[package]
name = "conduwuit_api"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

# `ctor` is used only via the `::ctor::ctor` paths emitted by
# `conduwuit_macros::introspect_crate!`. `reqwest` is only referenced from
# `[features]`, where it forwards compression backends to reqwest itself.
[package.metadata.cargo-machete]
ignored = ["const-str", "ctor", "reqwest"]

[features]
brotli_compression = [
	"conduwuit-core/brotli_compression",
	"conduwuit-service/brotli_compression",
	"reqwest/brotli",
]
element_hacks = [
	"conduwuit-service/element_hacks",
]
gzip_compression = [
	"conduwuit-core/gzip_compression",
	"conduwuit-service/gzip_compression",
	"reqwest/gzip",
]
io_uring = [
	"conduwuit-service/io_uring",
]
mimalloc = [
    "conduwuit-core/mimalloc",
    "conduwuit-service/mimalloc",
]
mimalloc_conf = [
	"conduwuit-core/mimalloc_conf",
	"conduwuit-service/mimalloc_conf",
]
mimalloc_prof = [
	"conduwuit-core/mimalloc_prof",
	"conduwuit-service/mimalloc_prof",
]
mimalloc_stats = [
	"conduwuit-core/mimalloc_stats",
	"conduwuit-service/mimalloc_stats",
]
ldap = [
    "conduwuit-service/ldap"
]
release_max_log_level = [
	"conduwuit-core/release_max_log_level",
	"conduwuit-service/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
]
zstd_compression = [
	"conduwuit-core/zstd_compression",
	"conduwuit-service/zstd_compression",
	"reqwest/zstd",
]

[dependencies]
axum-client-ip.workspace = true
axum-extra.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
conduwuit-core.workspace = true
conduwuit-macros.workspace = true
conduwuit-service.workspace = true
const-str.workspace = true
ctor.workspace = true
futures.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
itertools.workspace = true
log.workspace = true
matchit.workspace = true
rand.workspace = true
reqwest.workspace = true
rezzy.workspace = true
slipstream.workspace = true
serde_urlencoded.workspace = true
serde.workspace = true
sha1.workspace = true
tokio.workspace = true
tower.workspace = true
url.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# The route tests make reqwest-driven calls, which need a TLS crypto provider
# installed. `ring` is enabled here (test-only) so they have a deterministic
# provider regardless of which providers the library's consumers select.
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
