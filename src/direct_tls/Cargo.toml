[package]
name = "conduwuit_direct_tls"
description = "Optional direct TLS listener for integration tests"
edition = "2024"
license = "Apache-2.0"
version = "0.5.10"

[lib]
path = "lib.rs"

[dependencies]
async-fs = "2.2.0"
async-net = "2.0.0"
bytes = "1.10.1"
conduwuit_core = { path = "../core", version = "0.5.10" }
futures = "0.3.34"
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "ring", "tls12"] }
http = "1.3.1"
http-body = "1.1.0"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
log = { version = "0.4.27", default-features = false }
rustls-pemfile = "2.2.0"
smol = "2.0.2"
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
tower = "0.5.2"
