[package]
name = "conduwuit_admin"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

# `ctor` is used only via the `::ctor::ctor` paths emitted by
# `conduwuit_macros::introspect_crate!`.
[package.metadata.cargo-machete]
ignored = ["const-str", "ctor"]

[features]
brotli_compression = [
	"conduwuit-api/brotli_compression",
	"conduwuit-core/brotli_compression",
	"conduwuit-service/brotli_compression",
]
gzip_compression = [
	"conduwuit-api/gzip_compression",
	"conduwuit-core/gzip_compression",
	"conduwuit-service/gzip_compression",
]
mimalloc = [
	"conduwuit-api/mimalloc",
	"conduwuit-core/mimalloc",
	"conduwuit-database/mimalloc",
	"conduwuit-service/mimalloc",
]
mimalloc_conf = [
	"conduwuit-api/mimalloc_conf",
	"conduwuit-core/mimalloc_conf",
	"conduwuit-database/mimalloc_conf",
	"conduwuit-service/mimalloc_conf",
]
mimalloc_prof = [
	"conduwuit-api/mimalloc_prof",
	"conduwuit-core/mimalloc_prof",
	"conduwuit-database/mimalloc_prof",
	"conduwuit-service/mimalloc_prof",
]
mimalloc_stats = [
	"conduwuit-api/mimalloc_stats",
	"conduwuit-core/mimalloc_stats",
	"conduwuit-database/mimalloc_stats",
	"conduwuit-service/mimalloc_stats",
]
release_max_log_level = [
	"conduwuit-api/release_max_log_level",
	"conduwuit-core/release_max_log_level",
	"conduwuit-database/release_max_log_level",
	"conduwuit-service/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
]
zstd_compression = [
	"conduwuit-api/zstd_compression",
	"conduwuit-core/zstd_compression",
	"conduwuit-database/zstd_compression",
	"conduwuit-service/zstd_compression",
]

[dependencies]
toml = { workspace = true, features = ["display"] }
clap.workspace = true
conduwuit-api.workspace = true
conduwuit-build-metadata.workspace = true
conduwuit-core.workspace = true
conduwuit-database.workspace = true
conduwuit-macros.workspace = true
conduwuit-service.workspace = true
const-str.workspace = true
ctor.workspace = true
futures.workspace = true
log.workspace = true
smol.workspace = true
rezzy.workspace = true
slipstream.workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
