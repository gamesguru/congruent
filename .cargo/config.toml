[alias]
xtask = "run --package xtask --"

[build]
rustc-wrapper = ".cargo/cargo-wrapper.sh"

[env]
#RUSTC_WRAPPER = { value = "sccache", force = false }
# hardened_malloc-rs bakes `option_env!("CC")` into its build.rs and then execs
# the whole string as a single program name, so a shell `CC="sccache cc"` breaks
# it. Force a plain C compiler here; sccache is already wired up for rustc.
CC = { value = "cc", force = true }
# hardened_malloc-rs' vendored submodule is pinned to a version whose chacha.c
# hits GCC 16's new -Wunterminated-string-initialization warning (the 16-byte
# `sigma` string is intentionally NUL-free) and the Makefile sets -Werror.
# Bump hardened_malloc-rs once upstream fixes this; until then, suppress.
# NOTE: use only the -Wno-... form. Cargo exports CFLAGS to every cc-rs build
# (ring, aws-lc, ...), and on GCC < 14 `-Wno-error=<unknown-warning>` is itself
# a fatal error ("no option -W..."), which broke those builds on the Ubuntu
# 22.04/24.04 runners (GCC 11-13). Unknown -Wno-* options are silently ignored.
CFLAGS = { value = "-Wno-unterminated-string-initialization", force = true }
ROCKSDB_LIB_DIR = { value = "/usr/local/lib", force = false }
ROCKSDB_INCLUDE_DIR = { value = "/usr/local/include", force = false }
PKG_CONFIG_PATH = { value = "/usr/local/lib/pkgconfig", force = false }
ZSTD_SYS_USE_PKG_CONFIG = { value = "1", force = false }
JEMALLOC_OVERRIDE = { value = "/usr/local/lib/libjemalloc.so", force = false }
LD_LIBRARY_PATH = { value = "/usr/local/lib", force = false }

#
# You may need to install "mold", a more efficient linker than ld or cc
# Linux
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,-rpath,/usr/local/lib"
]

# ARM/Aarch64 (Raspberry Pi)
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,-rpath,/usr/local/lib"
]
