# Disposable, loopback-only configuration for trying a local server.
# From the repository root, run:
#   cargo run --bin conduwuit -- --config ./conduwuit-test.toml
#
# The database lives outside the repository. Remove /tmp/conduwuit-toy-db
# when you want to reset this test server. Do not point this config at real data.

[global]
server_name = "localhost"
address = ["127.0.0.1"]
port = 8008
database_path = "/tmp/conduwuit-toy-db"
