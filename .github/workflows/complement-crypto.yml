name: Complement-Crypto Tests

on:
  push:
    branches: [main, main-upstream]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SKIP_CONFIRM: 1

jobs:
  complement-crypto-tests:
    runs-on: ubuntu-24.04
    env:
      COMPLEMENT_PARALLEL: 24
      FEATURES: "direct_tls,url_preview"
      PROFILE: "dev-quick"

    # NOTE: to enable GitHub builds/workflows, add a REPOSITORY_VARIABLE
    # i.e., under /settings/variables/actions, C10Y_SOME_ENV_VAR=1
    # if: vars.C10Y_ENABLE_GITHUB_WORKFLOW_COMPLEMENT_CRYPTO != ''

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            liburing-dev \
            libbz2-dev \
            clang \
            libclang-dev \
            llvm-dev \
            mold \
            postgresql-client

      - name: Detect best CPU target
        id: cpu
        uses: ./.github/actions/get-cpu-target

      - name: Setup RocksDB and Jemalloc
        uses: ./.github/actions/setup-prebuilts
        with:
          cache-key: ubuntu-24.04
          arch: ${{ steps.cpu.outputs.target }}

      - name: Export CPU target env vars
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C target-cpu=${{ steps.cpu.outputs.target }}" | tee -a $GITHUB_ENV

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
        with:
          shared-key: ubuntu-24.04-${{ steps.cpu.outputs.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS PROFILE

      - name: Configure Docker Network Firewall
        run: |
          sudo ufw allow in on br-+ comment "(from Complement-Crypto testing) Allow traffic from custom Docker networks to the host machine (host.docker.internal)" || true

      - name: Build continuwuity for Complement
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: SKIP_CONFIRM=1 make build PROFILE=${{ env.PROFILE }} CARGO_FLAGS="--config Cargo.custom.toml --profile ${{ env.PROFILE }} --features direct_tls"

      - name: Build Complement Docker image
        run: make complement/docker PROFILE=${{ env.PROFILE }}

      - name: Build Complement-Crypto tester image
        run: make complement-crypto/docker

      - name: Run Complement-Crypto tests
        id: complement-crypto
        run: |
          # The homeserver-under-test is the exact complement image that
          # `make complement/docker` produced (same tag logic as complement.yml).
          COMPLEMENT_TAG="continuwuity:complement-$( (git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null || echo detached) | tr '[:upper:]/:@ ' '[:lower:]----' | tr -cs 'a-z0-9_.-' '-' | sed 's/^-//;s/-$//' | cut -c1-96 )"
          COMPLEMENT_CRYPTO_TAG="continuwuity:complement-crypto-$( (git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null || echo detached) | tr '[:upper:]/:@ ' '[:lower:]----' | tr -cs 'a-z0-9_.-' '-' | sed 's/^-//;s/-$//' | cut -c1-96 )"
          echo "homeserver image: $COMPLEMENT_TAG"
          echo "crypto tester image: $COMPLEMENT_CRYPTO_TAG"
          mkdir -p tests/test_results/complement-crypto
          docker run --rm \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/tests/test_results/complement-crypto:/var/lib/complement-crypto" \
            -e COMPLEMENT_CRYPTO_RUN=".*" \
            -e COMPLEMENT_CRYPTO_PARALLEL="3" \
            -e COMPLEMENT_CRYPTO_TIMEOUT="45m" \
            "$COMPLEMENT_CRYPTO_TAG" \
            "$COMPLEMENT_TAG"

      - name: Upload Complement-Crypto results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complement-crypto-results
          path: |
            tests/test_results/complement-crypto/results.jsonl
            tests/test_results/complement-crypto/full_output.jsonl
          retention-days: 90
